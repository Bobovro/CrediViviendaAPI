spring.application.name=CrediViviendaAPI
spring.datasource.url=jdbc:postgresql://localhost:5432/CrediViviendaAPI
server.port=8080
spring.datasource.username=postgres
spring.datasource.password=pass
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#No envia el trace al usuario cuando hay error.
server.error.include-stacktrace=never
#spring.jackson.date-format=yyyy-dd-MM

ip.frontend=http://localhost:4200

jwt.secret="Colocae tu jwt aquí"
